[package]
name = "svn-desktop-tool"
version = "0.1.0"
description = "SVN 图形化管理工具（TortoiseSVN 类，macOS 优先）"
authors = ["testuser"]
edition = "2021"

[lib]
name = "svn_desktop_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
quick-xml = "0.37"
base64 = "0.22"
similar = "2"
notify = "8.2.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
