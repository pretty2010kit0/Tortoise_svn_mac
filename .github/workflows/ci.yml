name: CI

# 触发：推送到 main 或任意 PR
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: 测试与构建（macOS）
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 22（缓存 npm 依赖）
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Rust 稳定版（缓存 cargo）
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 集成测试依赖真实 svn/svnadmin（tests/svn_flow.rs 硬编码 /opt/homebrew/bin）
      - name: 安装 Subversion（Homebrew）
        run: brew install subversion

      - name: 前端类型检查
        run: npm run typecheck

      - name: 前端构建
        run: npm run build

      - name: Rust 单元 + 集成测试（真实 svn 仓库闭环）
        run: cargo test
        working-directory: src-tauri

      - name: 文档空白检查
        run: git diff --check
